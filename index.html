    <style>
      /* Base styles */
      .wysiwyg-editor:focus { outline: none; }
      
      /* Shimmer animation for web search */
      @keyframes shimmer {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
      }
      
      /* Fade in animation for search results */
      @keyframes fade-in {
        0% { opacity: 0; transform: translateY(10px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      
      .animate-fade-in {
        animation: fade-in 0.3s ease-out forwards;
        opacity: 0;
      }
      .wysiwyg-editor h1 { font-size: 2em; font-weight: bold; margin-top: 0.67em; margin-bottom: 0.67em; }
      .wysiwyg-editor h2 { font-size: 1.5em; font-weight: bold; margin-top: 0.83em; margin-bottom: 0.83em; }
      .wysiwyg-editor h3 { font-size: 1.17em; font-weight: bold; margin-top: 1em; margin-bottom: 1em; }
      .wysiwyg-editor ul { list-style-type: disc; padding-left: 2rem; }
      .wysiwyg-editor li { margin-bottom: 0.5rem; }

      /* Light theme WYSIWYG */
      .light .wysiwyg-editor blockquote { 
        border-left: 4px solid #e5e5e5; /* neutral-200 */
        padding-left: 1rem; margin-left: 0; 
        color: #737373; /* neutral-500 */
        font-style: italic; 
      }
      
      /* Dark & Rockstar theme WYSIWYG */
      .dark .wysiwyg-editor blockquote, .rockstar .wysiwyg-editor blockquote {
        border-left: 4px solid #3b82f6; /* brand-500 */
        padding-left: 1rem; margin-left: 0; 
        color: #a3a3a3; /* neutral-400 */
        font-style: italic; 
      }
      .rockstar .wysiwyg-editor blockquote {
         border-left: 4px solid #c026d3; /* rockstar-purple */
      }

      /* Thinking Animation Styles */
      .thinking-animation {
          position: relative;
          width: 24px;
          height: 24px;
          animation: thinking-container-anim 5s infinite;
      }

      .thinking-animation .dot {
          position: absolute;
          top: 50%;
          left: 50%;
          width: 4px;
          height: 4px;
          margin-top: -2px;
          margin-left: -2px;
          border-radius: 50%;
      }
      .light .thinking-animation .dot { background-color: #60a5fa; } /* brand-400 */
      .dark .thinking-animation .dot { background-color: #93c5fd; } /* brand-300 */
      .rockstar .thinking-animation .dot { background-color: #f472b6; }


      .thinking-animation .dot1 { animation: dot1-anim 5s ease-in-out infinite; }
      .thinking-animation .dot2 { animation: dot2-anim 5s ease-in-out infinite; }
      .thinking-animation .dot3 { animation: dot3-anim 5s ease-in-out infinite; }

      @keyframes thinking-container-anim {
          50%, 80% { transform: rotate(360deg); }
          100% { transform: rotate(360deg); }
      }
      @keyframes dot1-anim {
          0%   { transform: translateX(-8px) translateY(0); }
          10%  { transform: translateX(-8px) translateY(-4px); }
          20%  { transform: translateX(-8px) translateY(0); }
          40%  { transform: translateX(-8px) translateY(0); }
          50%  { transform: translateY(-8px); }
          80%  { transform: translateY(-8px); }
          90%  { transform: translateX(-8px) translateY(0); }
          100% { transform: translateX(-8px) translateY(0); }
      }
      @keyframes dot2-anim {
          0%   { transform: translateX(0) translateY(0); }
          20%  { transform: translateX(0) translateY(-4px); }
          30%  { transform: translateX(0) translateY(0); }
          40%  { transform: translateX(0) translateY(0); }
          50%  { transform: translateX(-7px) translateY(4px); }
          80%  { transform: translateX(-7px) translateY(4px); }
          90%  { transform: translateX(0) translateY(0); }
          100% { transform: translateX(0) translateY(0); }
      }
      @keyframes dot3-anim {
          0%   { transform: translateX(8px) translateY(0); }
          30%  { transform: translateX(8px) translateY(-4px); }
          40%  { transform: translateX(8px) translateY(0); }
          50%  { transform: translateX(7px) translateY(4px); }
          80%  { transform: translateX(7px) translateY(4px); }
          90%  { transform: translateX(8px) translateY(0); }
          100% { transform: translateX(8px) translateY(0); }
      }

      /* Animated border for 'Done' column */
      .done-column-container {
        position: relative;
        padding: 1.5px; /* The border thickness */
        border-radius: 0.5rem; /* rounded-lg */
        overflow: hidden;
      }
      .done-column-container::before {
          content: '';
          position: absolute;
          z-index: -1;
          top: -50%;
          left: -50%;
          width: 200%;
          height: 200%;
          background: conic-gradient(
            from 180deg at 50% 50%,
            #3b82f6,
            #ec4899,
            #facc15,
            #a855f7,
            #3b82f6
          );
          animation: rotate-gradient 6s linear infinite;
      }

      @keyframes rotate-gradient {
          0% {
              transform: rotate(0deg);
          }
          100% {
              transform: rotate(360deg);
          }
      }

      #rockstar-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -20;
        display: none; /* Hidden by default */
      }
      .rockstar #rockstar-bg {
        display: block; /* Shown only for rockstar theme */
      }

      /* Highlight animation for updated files */
      @keyframes pulse-once-light {
        0%, 100% { background-color: transparent; }
        50% { background-color: rgba(59, 130, 246, 0.2); } /* brand-500/20 */
      }
       @keyframes pulse-once-dark {
        0%, 100% { background-color: transparent; }
        50% { background-color: rgba(30, 64, 175, 0.3); } /* brand-800/30 */
      }
      .light .animate-pulse-once {
        animation: pulse-once-light 1.5s ease-in-out;
      }
       .dark .animate-pulse-once, .rockstar .animate-pulse-once {
        animation: pulse-once-dark 1.5s ease-in-out;
      }

      /* Live AI Edit Animations */
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      .line-added, .line-modified, .line-deleted {
        animation: fadeIn 0.5s ease-in-out;
        transition: background-color 0.5s;
        border-radius: 4px;
        padding: 0 4px;
        margin: 0 -4px;
        display: block; /* Ensure it takes up the full line */
      }
      .line-deleted { 
        text-decoration: line-through; 
      }
      
      /* Light Theme Diff */
      .light .line-added { background-color: #dcfce7; } /* green-100 (Soft Salad Green) */
      .light .line-modified { background-color: #fef9c3; } /* yellow-100 (Soft Yellow) */
      .light .line-deleted { background-color: #ffedd5; opacity: 0.7; } /* orange-100 (Soft Orange) */

      /* Dark & Rockstar Theme Diff */
      .dark .line-added, .rockstar .line-added { background-color: rgba(74, 222, 128, 0.15); } /* green-400 with alpha */
      .dark .line-modified, .rockstar .line-modified { background-color: rgba(250, 204, 21, 0.15); } /* yellow-400 with alpha */
      .dark .line-deleted, .rockstar .line-deleted { background-color: rgba(251, 146, 60, 0.2); opacity: 0.6; } /* orange-400 with alpha */

    </style>

  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.1.1/",
    "react": "https://aistudiocdn.com/react@^19.1.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.1.1/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.19.0"
  }
}

  <body class="bg-neutral-50 text-neutral-900 dark:bg-neutral-900 dark:text-neutral-200 rockstar:bg-black rockstar:text-neutral-200">
    <div class="fixed top-0 left-0 w-full h-full -z-10 bg-[radial-gradient(ellipse_80%_80%_at_50%_-20%,rgba(120,119,198,0.05),rgba(255,255,255,0))] dark:bg-[radial-gradient(ellipse_80%_80%_at_50%_-20%,rgba(120,119,198,0.2),rgba(255,255,255,0))] rockstar:bg-transparent"></div>
    <canvas id="rockstar-bg"></canvas>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
     <script>
      // Rockstar theme background animation
      const canvas = document.getElementById('rockstar-bg');
      const ctx = canvas.getContext('2d');
      let animationFrameId;

      const setup = () => {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
      };
      
      let particles = [];
      const particleCount = 70;

      class Particle {
          constructor() {
              this.x = Math.random() * canvas.width;
              this.y = Math.random() * canvas.height;
              this.vx = (Math.random() - 0.5) * 0.5;
              this.vy = (Math.random() - 0.5) * 0.5;
              this.radius = Math.random() * 1.5 + 0.5;
              this.color = `rgba(236, 72, 153, ${Math.random() * 0.5 + 0.2})`; // rockstar-500
          }
          draw() {
              ctx.beginPath();
              ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
              ctx.fillStyle = this.color;
              ctx.fill();
          }
          update() {
              this.x += this.vx;
              this.y += this.vy;
              if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
              if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
          }
      }
      
      const initParticles = () => {
          particles = [];
          for (let i = 0; i < particleCount; i++) {
              particles.push(new Particle());
          }
      };

      const animate = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          
          for (let i = 0; i < particles.length; i++) {
              particles[i].update();
              particles[i].draw();
              
              for (let j = i + 1; j < particles.length; j++) {
                  const dx = particles[i].x - particles[j].x;
                  const dy = particles[i].y - particles[j].y;
                  const distance = Math.sqrt(dx * dx + dy * dy);
                  
                  if (distance < 100) {
                      ctx.beginPath();
                      ctx.moveTo(particles[i].x, particles[i].y);
                      ctx.lineTo(particles[j].x, particles[j].y);
                      ctx.strokeStyle = `rgba(168, 85, 247, ${1 - distance / 100})`; // rockstar-purple
                      ctx.lineWidth = 0.5;
                      ctx.stroke();
                  }
              }
          }
          animationFrameId = requestAnimationFrame(animate);
      };

      const startAnimation = () => {
        if (document.documentElement.classList.contains('rockstar')) {
          setup();
          initParticles();
          if (animationFrameId) cancelAnimationFrame(animationFrameId);
          animate();
        }
      };

      const stopAnimation = () => {
        if (animationFrameId) {
            cancelAnimationFrame(animationFrameId);
            animationFrameId = null;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      };
      
      const observer = new MutationObserver((mutationsList) => {
          for (const mutation of mutationsList) {
              if (mutation.type === 'attributes' && mutation.attributeName === 'class') {
                  if (document.documentElement.classList.contains('rockstar')) {
                      startAnimation();
                  } else {
                      stopAnimation();
                  }
              }
          }
      });
      
      observer.observe(document.documentElement, { attributes: true });

      // Initial check
      if (document.documentElement.classList.contains('rockstar')) {
        startAnimation();
      }

      window.addEventListener('resize', () => {
        if (document.documentElement.classList.contains('rockstar')) {
            startAnimation();
        }
      });
    </script>
